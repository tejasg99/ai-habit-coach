name: Send reminders

on:
  schedule:
    # Every 15 minutes (UTC), offset from the busy top of the hour to reduce delays.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: # lets you run it by hand from the Actions tab

concurrency:
  group: reminders
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m app.jobs.reminders
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Required by Settings but unused here: this job never signs a token, so it
          # gets no real secret. Least privilege.
          SECRET_KEY: not-used-by-this-job-but-required-by-settings
          EXPO_ACCESS_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}